<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Salsa Flash · Admin</title>
  <link rel="icon" href="/img/favicon.webp" type="image/webp">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    body { background: radial-gradient(80% 50% at 50% 0%, #3a0820, var(--bg) 70%) fixed; }
    .wrap { width: min(1100px, 100% - 32px); margin: 0 auto; padding: 28px 0 120px; }
    .top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
    .top img { width: 150px; }
    .top h1 { font: 900 22px/1 var(--display); flex: 1; }
    .top a { font-weight: 700; color: var(--pink-soft); }
    .card { background: rgba(36, 5, 20, .8); border: 1px solid var(--line); border-radius: 20px; padding: 18px; margin-bottom: 14px; }
    input, textarea, select {
      font: 600 14px var(--body); color: var(--chrome); background: rgba(0, 0, 0, .3); border: 1px solid var(--line);
      border-radius: 10px; padding: 10px 12px; outline: none; width: 100%; min-width: 0;
    }
    input:focus, textarea:focus { border-color: var(--pink-2); box-shadow: 0 0 0 3px rgba(255, 31, 142, .2); }
    textarea { min-height: 110px; font-family: ui-monospace, monospace; font-size: 13px; resize: vertical; }
    button { font: 800 13px/1 var(--body); cursor: pointer; border-radius: 999px; padding: 11px 16px; border: 1px solid var(--line); background: rgba(255, 255, 255, .06); color: var(--chrome); }
    button:hover { border-color: var(--pink-soft); }
    button.hot { background: linear-gradient(180deg, #ff6ab8, var(--pink) 55%, #c4006a); border: 0; color: #fff; box-shadow: 0 6px 22px rgba(255, 31, 142, .45); }
    button.danger { color: #ff9cb0; }
    button:disabled { opacity: .5; cursor: default; }
    .login { max-width: 380px; margin: 14vh auto 0; text-align: center; }
    .login img { width: 260px; margin: 0 auto 10px; }
    .login form { display: grid; gap: 10px; }
    .err { color: #ff9cb0; font-weight: 700; min-height: 1.4em; margin: 6px 0 0; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .toolbar .grow { flex: 1; min-width: 200px; }
    .agency-head { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(0, 1.5fr); gap: 12px 10px; align-items: end; }
    .agency-head > :first-child { grid-column: 1 / 4; grid-row: 1; }
    .agency-head .btns { grid-column: 4; grid-row: 1; display: flex; gap: 6px; justify-content: flex-end; }
    .agency-head .btns button { padding: 11px 12px; }
    input.ok { border-color: rgba(125, 255, 182, .55); }
    .hint { color: #ffb3c6; font-size: 12px; font-weight: 700; }
    label { display: grid; gap: 4px; font: 700 11px/1.2 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .stats { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 10px; }
    .stat { font: 700 13px/1 var(--body); padding: 8px 12px; border-radius: 999px; background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .1); }
    .stat.ok { color: var(--ok); border-color: rgba(125, 255, 182, .35); background: rgba(125, 255, 182, .08); }
    .stat.q { background: var(--pink); color: #fff; border: 0; }
    details > summary { cursor: pointer; font-weight: 700; color: var(--pink-soft); margin: 4px 0; }
    .streamers { display: grid; grid-template-columns: 1fr 160px 36px; gap: 6px; margin-top: 10px; align-items: center; }
    .streamers .h { font: 700 11px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .streamers input.hit { border-color: rgba(125, 255, 182, .45); }
    .x { padding: 0; width: 32px; height: 32px; }
    .row-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .savebar {
      position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 30; display: flex; gap: 12px; align-items: center;
      background: rgba(26, 4, 16, .92); backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 999px; padding: 8px 8px 8px 18px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, .5); font-weight: 700; font-size: 14px; white-space: nowrap;
    }
    .dirty { color: var(--pink-soft); }
    .muted { color: var(--muted); font-size: 13px; }
    .warn { border-color: #ff9cb0; color: #ffd0da; }
    .hidden-tag { font-size: 11px; color: var(--muted); }
    @media (max-width: 760px) {
      .agency-head { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .agency-head > :first-child { grid-column: 1 / -1; }
      .agency-head .btns { grid-column: 1 / -1; grid-row: auto; order: 9; justify-content: flex-start; }
      .agency-head .wide { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <div class="wrap" id="app"></div>
  <script>
(() => {
  const app = document.getElementById('app');
  const R = { minStreamers: 10, minTotal: 500000, minActive: 6, activeThreshold: 9750 };
  let pw = ''; try { pw = sessionStorage.getItem('pw') || ''; } catch {}
  let data = null, dirty = false, saving = false, filter = '', dbWarn = false;
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = (n) => Number(n || 0).toLocaleString('ru-RU');
  const toInt = (v) => { const n = Math.round(Number(String(v ?? '').replace(/[\s,]/g, '').replace(/k$/i, '000'))); return Number.isFinite(n) && n > 0 ? n : 0; };
  // ISO <-> value for <input type="datetime-local"> in the admin's own time zone
  const toLocalInput = (iso) => { if (!iso) return ''; const d = new Date(iso); if (isNaN(d)) return ''; d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };
  const fromLocalInput = (v) => { const d = new Date(v); return v && !isNaN(d) ? d.toISOString() : ''; };
  const nowIso = () => { const d = new Date(); d.setSeconds(0, 0); return d.toISOString(); };

  // Older saves had a streamer list and an agency ID — convert on load.
  function normalize(a) {
    if (Array.isArray(a.streamers)) {
      const list = a.streamers;
      a = { ...a, streamers: list.length, total: list.reduce((s, x) => s + toInt(x.coins), 0), active: list.filter((x) => toInt(x.coins) >= R.activeThreshold).length };
    }
    return { name: a.name || a.id || '', hidden: !!a.hidden, streamers: toInt(a.streamers), total: toInt(a.total), active: toInt(a.active), lastInvite: a.lastInvite || '' };
  }

  async function api(method, body) {
    const r = await fetch('/api/admin', { method, headers: { 'x-admin-password': pw, 'Content-Type': 'application/json' }, body: body && JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(j.error || r.status), { status: r.status });
    return j;
  }

  function loginView(msg = '') {
    app.innerHTML = `<div class="login card"><img src="/img/logo.webp" alt="Salsa Flash">
      <form id="lf"><input type="password" id="pw" placeholder="Admin password" autocomplete="current-password" autofocus>
      <button class="hot">Sign in</button></form><p class="err">${esc(msg)}</p></div>`;
    document.getElementById('lf').onsubmit = async (e) => { e.preventDefault(); pw = document.getElementById('pw').value; await boot(); };
  }

  async function boot() {
    try {
      const j = await api('GET');
      try { sessionStorage.setItem('pw', pw); } catch {}
      dbWarn = !j.database;
      data = { agencies: (j.agencies || []).map(normalize), updatedAt: j.updatedAt };
      dirty = false; render();
    } catch (e) {
      try { sessionStorage.removeItem('pw'); } catch {}
      loginView(pw ? (e.status === 401 ? 'Wrong password' : e.message) : '');
    }
  }

  const checks = (a) => {
    const c = { s: a.streamers >= R.minStreamers, t: a.total >= R.minTotal, a: a.active >= R.minActive };
    return { ...c, q: c.s && c.t && c.a };
  };

  function statsHtml(a) {
    const c = checks(a);
    return `<span class="stat ${c.s ? 'ok' : ''}">Streamers ${fmt(a.streamers)} / ${R.minStreamers}</span>
      <span class="stat ${c.t ? 'ok' : ''}">Total ${fmt(a.total)} / ${fmt(R.minTotal)}</span>
      <span class="stat ${c.a ? 'ok' : ''}">9 750+: ${fmt(a.active)} / ${R.minActive}</span>
      ${c.q ? '<span class="stat q">Qualified</span>' : ''}${a.hidden ? '<span class="hidden-tag">hidden from public page</span>' : ''}
      ${a.active > a.streamers ? '<span class="hint">“9 750+” can’t be more than the number of streamers</span>' : ''}`;
  }

  function agencyCard(a, i) {
    return `<div class="card" data-i="${i}">
      <div class="agency-head">
        <label>Agency name<input data-f="name" value="${esc(a.name)}"></label>
        <label>Streamers<input data-f="streamers" data-num inputmode="numeric" value="${a.streamers || ''}" placeholder="0"></label>
        <label>Total coins<input data-f="total" data-num inputmode="numeric" value="${a.total ? fmt(a.total) : ''}" placeholder="0"></label>
        <label>Streamers 9 750+<input data-f="active" data-num inputmode="numeric" value="${a.active || ''}" placeholder="0"></label>
        <label class="wide">Last invite<div style="display:flex;gap:6px"><input type="datetime-local" data-f="lastInvite" value="${toLocalInput(a.lastInvite)}"><button data-act="now" title="Set to now">Now</button></div></label>
        <div class="btns"><button data-act="hide">${a.hidden ? 'Show' : 'Hide'}</button><button class="danger" data-act="del">Delete</button></div>
      </div>
      <div class="stats">${statsHtml(a)}</div>
    </div>`;
  }

  function render() {
    const list = data.agencies.map((a, i) => [a, i]).filter(([a]) => !filter || a.name.toLowerCase().includes(filter));
    const q = data.agencies.filter((a) => checks(a).q).length;
    app.innerHTML = `
      <div class="top"><img src="/img/logo.webp" alt=""><h1>Admin</h1>
        <a href="/" target="_blank" rel="noopener">Open public page ↗</a><button data-act="logout">Sign out</button></div>
      ${dbWarn ? '<div class="card warn">No database connected — changes are saved to a local file only. On Vercel, add Upstash Redis under Storage and redeploy.</div>' : ''}
      <div class="card">
        <div class="toolbar">
          <input class="grow" id="flt" placeholder="Filter agencies by name" value="${esc(filter)}">
          <button class="hot" data-act="new">+ New agency</button>
          <button data-act="export">Export CSV</button>
        </div>
        <p class="muted" style="margin:10px 0 0">${data.agencies.length} agencies · ${q} qualified. Ranking on the site: qualified agencies first, ordered by total coins. Times are in your time zone.</p>
        <details style="margin-top:10px"><summary>Bulk import from spreadsheet</summary>
          <p class="muted">Columns: <code>agency name, streamers, total coins, streamers 9 750+, last invite</code> (last invite optional, e.g. <code>2026-11-09 12:30</code>). One row per agency, header row optional — copy straight from a spreadsheet. Agencies with the same name are updated, new names are added.</p>
          <textarea id="bulk" placeholder="HADUPIAK	70	500000	12	2026-11-09 12:30"></textarea>
          <div class="row-actions"><button data-act="bulk">Import</button></div>
        </details>
      </div>
      <div id="list">${list.map(([a, i]) => agencyCard(a, i)).join('') || '<p class="muted">No agencies yet. Click “New agency”.</p>'}</div>
      <div class="savebar"><span class="${dirty ? 'dirty' : 'muted'}" id="st">${dirty ? '● Unsaved changes' : data.updatedAt ? 'Saved ' + new Date(data.updatedAt).toLocaleString() : 'Nothing saved yet'}</span>
        <button class="hot" data-act="save" ${dirty && !saving ? '' : 'disabled'}>${saving ? 'Saving…' : 'Save & publish'}</button></div>`;
    const flt = document.getElementById('flt');
    flt.oninput = () => { filter = flt.value.trim().toLowerCase(); const pos = flt.selectionStart; render(); const f = document.getElementById('flt'); f.focus(); f.setSelectionRange(pos, pos); };
  }

  const touch = () => { dirty = true; const st = document.getElementById('st'); if (st) { st.textContent = '● Unsaved changes'; st.className = 'dirty'; } const b = app.querySelector('[data-act="save"]'); if (b) b.disabled = false; };
  const refreshStats = (card) => { card.querySelector('.stats').innerHTML = statsHtml(data.agencies[+card.dataset.i]); };

  app.addEventListener('input', (e) => {
    const card = e.target.closest('[data-i]'); const f = e.target.dataset.f; if (!card || !f) return;
    const a = data.agencies[+card.dataset.i];
    if (f === 'name') a.name = e.target.value;
    else if (f === 'lastInvite') a.lastInvite = fromLocalInput(e.target.value);
    else a[f] = toInt(e.target.value);
    touch(); refreshStats(card);
  });
  app.addEventListener('change', (e) => {   // tidy up number formatting when leaving a field
    if (e.target.dataset.f === 'total') { const v = toInt(e.target.value); e.target.value = v ? fmt(v) : ''; }
  });

  function parseDate(v) {
    v = String(v || '').trim(); if (!v) return '';
    const m = v.match(/^(\d{1,2})[./](\d{1,2})[./](\d{4})(?:[ T](\d{1,2}):(\d{2}))?$/); // 09.11.2026 12:30
    const d = m ? new Date(+m[3], m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0)) : new Date(v.replace(' ', 'T'));
    return isNaN(d) ? '' : d.toISOString();
  }

  app.addEventListener('click', async (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const card = b.closest('[data-i]'); const i = card ? +card.dataset.i : -1; const a = data?.agencies[i];
    const act = b.dataset.act;
    if (act === 'now') { e.preventDefault(); a.lastInvite = nowIso(); card.querySelector('[data-f="lastInvite"]').value = toLocalInput(a.lastInvite); touch(); return; }
    if (act === 'hide') { a.hidden = !a.hidden; touch(); return render(); }
    if (act === 'del') { if (confirm(`Delete agency “${a.name || 'unnamed'}”?`)) { data.agencies.splice(i, 1); touch(); render(); } return; }
    if (act === 'new') { data.agencies.unshift({ name: '', hidden: false, streamers: 0, total: 0, active: 0, lastInvite: '' }); filter = ''; touch(); render(); app.querySelector('[data-i="0"] [data-f="name"]').focus(); return; }
    if (act === 'logout') { try { sessionStorage.removeItem('pw'); } catch {} pw = ''; return loginView(); }
    if (act === 'export') {
      const lines = [['agency_name', 'streamers', 'total_coins', 'streamers_9750_plus', 'last_invite', 'hidden']];
      data.agencies.forEach((ag) => lines.push([ag.name, ag.streamers, ag.total, ag.active, ag.lastInvite ? toLocalInput(ag.lastInvite).replace('T', ' ') : '', ag.hidden ? 'yes' : '']));
      const csv = lines.map((l) => l.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
      const url = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' }));
      Object.assign(document.createElement('a'), { href: url, download: 'salsa-flash.csv' }).click(); return;
    }
    if (act === 'bulk') {
      const text = document.getElementById('bulk').value.trim(); if (!text) return;
      let added = 0, updated = 0, bad = 0;
      text.split(/\r?\n/).forEach((l) => {
        if (!l.trim()) return;
        const c = (l.includes('\t') ? l.split('\t') : l.split(';').length > 1 ? l.split(';') : l.split(',')).map((x) => x.trim().replace(/^"|"$/g, ''));
        if (c.length < 4 || !c[0]) { bad++; return; }
        if (/agency|агент/i.test(c[0]) && !toInt(c[1])) return; // header row
        const row = { name: c[0], streamers: toInt(c[1]), total: toInt(c[2]), active: toInt(c[3]), lastInvite: parseDate(c[4]) };
        const ex = data.agencies.find((x) => x.name.trim().toLowerCase() === row.name.toLowerCase());
        if (ex) { Object.assign(ex, row, { lastInvite: row.lastInvite || ex.lastInvite }); updated++; }
        else { data.agencies.push({ hidden: false, ...row }); added++; }
      });
      alert(`Added ${added}, updated ${updated}${bad ? `, skipped ${bad} lines (need at least 4 columns)` : ''}. Press “Save & publish” to make it live.`);
      touch(); return render();
    }
    if (act === 'save') {
      if (data.agencies.some((x) => !x.name.trim()) && !confirm('Agencies without a name will be removed. Save anyway?')) return;
      saving = true; render();
      try { const r = await api('PUT', data); data.updatedAt = r.updatedAt; data.agencies = data.agencies.filter((x) => x.name.trim()); dirty = false; }
      catch (err) { alert('Save failed: ' + err.message); if (err.status === 401) { saving = false; return loginView('Session expired — sign in again'); } }
      saving = false; render();
    }
  });

  window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
  pw ? boot() : loginView();
})();
  </script>
</body>
</html>
